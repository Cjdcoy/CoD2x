name: Build Windows Test DLL

on:
  push:
    branches:
      - cod4-bounce-listen-server
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.1-12.0.0-msvcrt-r2/winlibs-i686-posix-dwarf-gcc-14.2.0-mingw-w64msvcrt-12.0.0-r2.zip"
          $zip = "$env:RUNNER_TEMP\mingw.zip"
          $extractDir = "$env:RUNNER_TEMP\mingw"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extractDir

          New-Item -ItemType Directory -Path tools -Force | Out-Null
          $mingwDir = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          Move-Item -Path $mingwDir.FullName -Destination tools\mingw

          "$env:GITHUB_WORKSPACE\tools\mingw\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build mss32.dll
        shell: pwsh
        run: |
          mingw32-make prebuild configure_win DEBUG=0 WIN_BUILD_DIR=build/win-Release
          cmake --build build/win-Release --target mss32 --parallel
          Remove-Item -Path bin/windows/mss32.dll -Force -ErrorAction SilentlyContinue
          Move-Item -Path bin/windows/mss32.build.dll -Destination bin/windows/mss32.dll -Force

      - name: Upload mss32.dll
        uses: actions/upload-artifact@v4
        with:
          name: cod2x-mss32-listen-server-test-dll
          path: bin/windows/mss32.dll
          if-no-files-found: error
